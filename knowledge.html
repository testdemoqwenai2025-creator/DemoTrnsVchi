<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Searchable encyclopedia of AV/Robotics concepts.">
  <title>Knowledge Vault · AV/Robotics Ops Center</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>
  <div id="site-header"></div>
  <div id="mobile-nav-host"></div>
  <main id="main">
    <div class="container">
      <div class="page-header">
        <h1>Knowledge Vault</h1>
        <p>Encyclopedia of AV/Robotics concepts. Click a card to see the full entry.</p>
      </div>
      <div class="mb-4">
        <input id="kb-search" class="form-input" type="search" placeholder="Search titles, summaries, codes…">
      </div>
      <div class="grid-2" id="kb-grid"></div>
      <div class="card mt-4">
        <div class="card-header"><div class="card-title">📸 Module screenshot</div></div>
        <img src="screenshots/knowledge-module.png" alt="Knowledge module" style="width:100%; display:block;">
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
  <script>
    AVops.init('knowledge.html');
    const grid = document.getElementById('kb-grid');
    const search = document.getElementById('kb-search');

    function render(filter) {
      grid.innerHTML = '';
      const f = (filter || '').toLowerCase();
      const items = MockData.knowledge.filter(k => !f || (k.title + ' ' + k.summary + ' ' + k.relatedCodes.join(' ')).toLowerCase().includes(f));
      items.forEach(k => {
        const card = AVops.el('div', { class: 'card' });
        card.appendChild(AVops.el('div', { class: 'card-header' }, AVops.el('div', { class: 'card-title' }, '<span class="badge badge-info">' + k.category + '</span> ' + k.title)));
        const body = AVops.el('div', { class: 'card-body' });
        body.appendChild(AVops.el('p', { class: 'text-sm text-muted' }, k.summary));
        if (k.relatedCodes.length) {
          body.appendChild(AVops.el('div', { class: 'text-xs' }, '<strong>Codes:</strong> ' + k.relatedCodes.map(c => '<span class="badge badge-warn" style="margin-left:4px;">' + c + '</span>').join('')));
        }
        card.appendChild(body);
        grid.appendChild(card);
      });
      if (items.length === 0) grid.appendChild(AVops.el('div', { class: 'callout' }, 'No matches for "' + filter + '".'));
    }
    search.addEventListener('input', () => render(search.value));
    render('');
  </script>
</body>
</html>
