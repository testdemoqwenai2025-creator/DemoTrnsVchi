<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Multi-modal sensor fusion: LiDAR/RADAR/RGB-D/Ultrasonic sync, 3D object detection with EKF/UKF, semantic segmentation, adverse-weather filtering.">
  <title>Perception &amp; Sensor Fusion · AV/Robotics Ops Center</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>
  <div id="site-header"></div>
  <div id="mobile-nav-host"></div>
  <main id="main">
    <div class="container">
      <div class="page-header">
        <h1>Perception &amp; Sensor Fusion</h1>
        <p>Multi-modal ingestion (LiDAR / RADAR / RGB-D / Ultrasonic), object detection &amp; tracking with EKF/UKF, semantic segmentation, and adverse-weather filtering.</p>
      </div>

      <div class="grid-4 mb-4" id="sensor-grid"></div>

      <div class="card mb-4">
        <div class="card-header"><div class="card-title">🎯 Detected objects (<span id="obj-count">0</span>)</div></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>ID</th><th>Class</th><th>Pos (m)</th><th>Vel (m/s)</th><th>Conf</th><th>Filter</th><th>Age</th></tr></thead>
            <tbody id="obj-tbody"></tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <div class="card-header"><div class="card-title">📸 Module screenshot</div></div>
        <img src="screenshots/perception-module.png" alt="Perception module" style="width:100%; display:block;">
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
  <script>
    AVops.init('perception.html');
    const grid = document.getElementById('sensor-grid');
    MockData.perception.sensors.forEach(s => {
      const c = AVops.el('div', { class: 'card' });
      c.appendChild(AVops.el('div', { class: 'card-header' }, AVops.el('div', { class: 'card-title' }, s.modality.toUpperCase())));
      const b = AVops.el('div', { class: 'card-body text-sm' });
      b.appendChild(AVops.el('div', { class: 'mb-2' }, '<span class="badge badge-' + (s.health === 'nominal' ? 'active' : 'warn') + '">' + s.health + '</span> <span class="text-muted text-xs">' + s.degrade + '</span>'));
      b.appendChild(AVops.el('div', { class: 'text-xs text-muted mb-2' }, 'Drift: <span class="mono">' + s.driftUs + ' µs</span> · Rate: <span class="mono">' + s.fps + ' Hz</span>'));
      b.appendChild(AVops.el('div', { class: 'text-xs text-muted' }, 'Returns: <span class="mono">' + s.points.toLocaleString() + '</span>'));
      c.appendChild(b);
      grid.appendChild(c);
    });

    const tbody = document.getElementById('obj-tbody');
    MockData.perception.objects.forEach(o => {
      const conf = o.conf;
      const tr = document.createElement('tr');
      tr.innerHTML = '<td class="mono">' + o.id + '</td>' +
        '<td><span class="badge badge-' + (o.class === 'pedestrian' ? 'warn' : o.class === 'vehicle' ? 'info' : o.class === 'cyclist' ? 'active' : 'muted') + '">' + o.class + '</span></td>' +
        '<td class="mono">' + o.pos[0].toFixed(1) + ', ' + o.pos[1].toFixed(1) + '</td>' +
        '<td class="mono">' + o.vel[0].toFixed(1) + ', ' + o.vel[1].toFixed(1) + '</td>' +
        '<td class="mono" style="color:' + (conf < 0.5 ? 'var(--warn)' : 'var(--fg)') + ';">' + conf.toFixed(2) + '</td>' +
        '<td class="mono">' + o.filter + '</td>' +
        '<td class="mono">' + o.age.toFixed(1) + 's</td>';
      tbody.appendChild(tr);
    });
    document.getElementById('obj-count').textContent = MockData.perception.objects.length;
  </script>
</body>
</html>
